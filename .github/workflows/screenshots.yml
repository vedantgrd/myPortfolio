name: Update screenshots

on:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    - cron: "0 3 * * 0"     # weekly, Sunday 03:00 UTC

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (isolated, outside the project)
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Take screenshots
        run: |
          cp scripts/screenshots.mjs /tmp/pw/screenshots.mjs
          cd /tmp/pw
          OUT_DIR="$GITHUB_WORKSPACE/docs/screenshots" node screenshots.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "chore: update screenshots"
          git push